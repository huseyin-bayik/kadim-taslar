  if(k==='atk'){const n=c.atk[atkI++%c.atk.length];play(c,n,true);if(c.mage)setTimeout(()=>bolt(c),n==='Spellcast_Long'?900:450);}
  else if(k==='block')play(c,'Block',true);
  else if(k==='spell'){play(c,'Spellcast_Raise',true);setTimeout(()=>bolt(c,1),600);}
  else if(k==='dodge')play(c,['Dodge_Forward','Dodge_Left','Dodge_Backward','Dodge_Right'][atkI++%4],true);
  else if(k==='hit')play(c,['Hit_A','Hit_B'][atkI++%2],true);
  else if(k==='cheer')play(c,'Cheer',true);
  else if(k==='jump')play(c,'Jump_Full_Short',true);
  else if(k==='sit')play(c,'Sit_Floor_Down',true,()=>{play(c,'Sit_Floor_Idle');setTimeout(()=>{if(c.cur===c.mixer.clipAction(c.clips['Sit_Floor_Idle']))play(c,'Sit_Floor_StandUp',true);},2500);});
  else if(k==='die')play(c,'Death_A',true,()=>setTimeout(()=>play(c,'Lie_StandUp',true),1400));}
const boltTex=glowTex('rgba(190,120,255,1)');
function bolt(c,up){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:boltTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,color:up?0xffd77a:0xffffff}));
  s.scale.setScalar(up?1.6:1.1);const d=new V3(Math.sin(c.obj.rotation.y),0,Math.cos(c.obj.rotation.y));s.position.copy(c.obj.position).addScaledVector(d,.6).y+=up?2.4:1.3;scene.add(s);
  bolts.push({s,d:up?new V3(0,1,0):d,t:0});}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800);}
document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const c=CH.find(x=>x.id===b.dataset.ch);if(c&&c.obj)select(c);});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
function modelsTick(dt){for(const c of CH){if(!c.mixer)continue;c.mixer.update(dt);
    if(c.walking){c.wa+=dt*(c.running?.9:.42);const r=1.6,cx=c.home.x-Math.sin(c.face)*r,cz=c.home.z-Math.cos(c.face)*r,a=c.face+c.wa;
      const x=cx+Math.sin(a)*r,z=cz+Math.cos(a)*r;c.obj.position.set(x,H(x,z),z);c.obj.rotation.y=a+Math.PI/2;}
    else if(c.wa){c.obj.position.lerp(tmp.set(c.home.x,H(c.home.x,c.home.z),c.home.z),Math.min(1,dt*3));let d=((c.face-c.obj.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;c.obj.rotation.y+=d*Math.min(1,dt*4);}}
  if(sel&&sel.obj){selRing.visible=true;selRing.position.set(sel.obj.position.x,sel.obj.position.y+.04,sel.obj.position.z);selRing.material.opacity=.6+Math.sin(t*4)*.25;}
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t+=dt;b.s.position.addScaledVector(b.d,dt*9);b.s.material.opacity=1-b.t/1.2;if(b.t>1.2){scene.remove(b.s);bolts.splice(i,1);}}}

// ---------- loop ----------
let t=0,last=performance.now(),fc=0,ft=0;const tgt=new V3(),tmp=new V3();let ang=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;uT.value=t;wU.uT.value=t;
  // hero walks around plaza
  ang+=dt*.16;const RR=8.5,hx=Math.cos(ang)*RR,hz=Math.sin(ang)*RR;hero.position.set(hx,H(hx,hz),hz);hero.rotation.y=Math.atan2(-Math.sin(ang),Math.cos(ang));
  const w=t*6.2,s=Math.sin(w);LL.hip.rotation.x=s*.55;LR.hip.rotation.x=-s*.55;LL.knee.rotation.x=Math.max(0,-Math.sin(w+.9))*.9;LR.knee.rotation.x=Math.max(0,Math.sin(w+.9))*.9;
  AL.sh.rotation.x=-s*.45;AL.el.rotation.x=-.25-Math.max(0,s)*.3;AR.sh.rotation.x=s*.3-.15;AR.el.rotation.x=-.55;AL.sh.rotation.z=-.08;AR.sh.rotation.z=.12;
  body.position.y=Math.abs(Math.cos(w))*.06;body.rotation.y=s*.06;head.rotation.y=Math.sin(t*.7)*.25;
  const ca=capeG.attributes.position.array;for(let i=0;i<ca.length;i+=3){const y=-capeBase[i+1];ca[i+2]=capeBase[i+2]-y*y*.35-Math.sin(t*5+capeBase[i]*3+y*4)*.05*y;}capeG.attributes.position.needsUpdate=true;capeG.computeVertexNormals();
  modelsTick(dt);
  // metin
  const pu=.85+Math.sin(t*2.2)*.15;metin.userData.g.material.opacity=pu*(.35+lamp*.65);metin.userData.l.intensity=2.2*pu;metin.rotation.y=t*.15;
  const pp=metin.userData.p.geometry.attributes.position;for(let i=0;i<pp.count;i++){let y=pp.getY(i)+dt*.7;if(y>5)y=0;pp.setY(i,y);}pp.needsUpdate=true;
  for(const L of lanterns)L.userData.g.material.opacity=lamp*(.8+Math.random()*.08);
  // camera
  if(auto)yaw+=dt*.12;tgt.lerp(tmp.copy(lock&&sel&&sel.obj?sel.obj.position:tmp.set(-1,0,2)).add(new V3(0,1.05,0)),Math.min(1,dt*4));
  const cp=tmp.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(lock?dist*.6:dist*1.6).add(tgt);
  const gy=H(cp.x,cp.z)+.6;if(cp.y<gy)cp.y=gy;cam.position.lerp(cp,Math.min(1,dt*5));cam.lookAt(tgt);
  sun.target.position.copy(tgt);sun.position.copy(skyU.uS.value).multiplyScalar(80).add(tgt);sky.position.copy(cam.position);
  R.render(scene,cam);fc++;ft+=dt;if(ft>.5){$('fps').textContent=Math.round(fc/ft)+' fps';fc=0;ft=0;}}
requestAnimationFrame(loop);
})();
